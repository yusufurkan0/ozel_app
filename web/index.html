<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ozel_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ozel_app</title>
  <link rel="manifest" href="manifest.json">
</head>
  <!-- Tesseract.js for In-Browser Client-Side Web OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    window.ocrRecognizeImage = async function(imageUrl) {
      try {
        console.log("OCR Tesseract başlatılıyor...");
        const worker = await Tesseract.createWorker(['tur', 'eng']);
        const res = await worker.recognize(imageUrl);
        await worker.terminate();
        console.log("OCR Tesseract sonucu:", res.data.text);
        return res.data.text || "";
      } catch (err) {
        console.error("OCR Tesseract hatası:", err);
        return "";
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
